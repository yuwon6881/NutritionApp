name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: AIzaSyBtUAhmSAd8zW0P5PQnqu_Yy-L9DRCV2KQ
  VITE_FIREBASE_AUTH_DOMAIN: project-7eb1aec8-8636-4c86-b2a.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: project-7eb1aec8-8636-4c86-b2a
  VITE_FIREBASE_MESSAGING_SENDER_ID: "396431756440"
  VITE_FIREBASE_APP_ID: 1:396431756440:web:f2e74bd2566b3cdcad54ed
  VITE_FIREBASE_VAPID_KEY: BJsjolBzIZjdSHuWgjmSJ35PfZX-DHEoJPN2loGDkjCNAW_E8nEq8zJxldrEKlmfpKYRfvY0GRI3_TnBjXMg_N4

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore NutritionApp.slnx
      - run: dotnet build NutritionApp.slnx --no-restore --configuration Release
      - run: dotnet test tests/Nutrition.Tests.csproj --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:docs
      - run: npm run check:standards
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:visual
        working-directory: web
