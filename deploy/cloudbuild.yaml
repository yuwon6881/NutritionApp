steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nutrition-api"
        # Deploy by $BUILD_ID: it is always defined, whereas $COMMIT_SHA is empty for manually
        # triggered builds. The commit tag is added alongside it whenever there is one, so an image
        # can still be traced back to its source revision.
        docker build -t "$$IMAGE:$BUILD_ID" -t "$$IMAGE:latest" .
        if [ -n "$COMMIT_SHA" ]; then
          docker tag "$$IMAGE:$BUILD_ID" "$$IMAGE:$COMMIT_SHA"
          docker push "$$IMAGE:$COMMIT_SHA"
        fi
        docker push "$$IMAGE:$BUILD_ID"
        docker push "$$IMAGE:latest"
    id: BuildPush

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - nutrition-migrate
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nutrition-api:$BUILD_ID
      - --region=asia-southeast1
      - --service-account=nutrition-api@$PROJECT_ID.iam.gserviceaccount.com
      - --command=dotnet
      - --args=Nutrition.Api.dll,--migrate-only
      - --set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__NutritionAudience=nutrition-api,Identity__WorkoutAudience=workout-api,Integrations__KmsKeyName=projects/$PROJECT_ID/locations/asia-southeast1/keyRings/fitness/cryptoKeys/integration-tokens
      - --set-secrets=ConnectionStrings__Database=nutrition-neon-database:latest,Identity__ClientSecret=fitness-nutrition-client-secret:latest
    id: Migrate
    waitFor: [BuildPush]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: [run, jobs, execute, nutrition-migrate, --region=asia-southeast1, --wait]
    id: MigrateExecute
    waitFor: [Migrate]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nutrition-api
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nutrition-api:$BUILD_ID
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --memory=512Mi
      - --cpu=1
      - --timeout=180
      - --concurrency=20
      - --service-account=nutrition-api@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=PublicOrigin=${_PUBLIC_ORIGIN},Auth__MaxUsers=2,Database__MigrateOnStartup=false,Identity__Authority=${_FITNESS_ACCOUNT_AUTHORITY},Identity__Issuer=${_FITNESS_ACCOUNT_ISSUER},Identity__ClientId=nutrition-api,Identity__RedirectUri=${_NUTRITION_REDIRECT_URI},Identity__ReturnUrl=/,Identity__ConnectReturnUrl=/settings,Identity__NutritionAudience=nutrition-api,Identity__WorkoutAudience=workout-api,Integrations__KmsKeyName=projects/$PROJECT_ID/locations/asia-southeast1/keyRings/fitness/cryptoKeys/integration-tokens,Integrations__WorkoutTrainingSummaryUrl=${_WORKOUT_SUMMARY_URL},Physique__Bucket=${_PHYSIQUE_BUCKET},ScanStorage__Bucket=${_SCAN_BUCKET},OpenAi__Model=gpt-5.4-mini,Retention__MealDetailDays=90
      - --set-secrets=ConnectionStrings__Database=nutrition-neon-database:latest,Identity__ClientSecret=fitness-nutrition-client-secret:latest,OpenAi__ApiKey=financialapp-openai-api-key:latest,Cleanup__Token=nutrition-cleanup-token:latest
    id: Deploy
    waitFor: [MigrateExecute]

images: ['asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nutrition-api:$BUILD_ID']
substitutions:
  _PUBLIC_ORIGIN: 'https://nutrition-diary-app.vercel.app'
  _FITNESS_ACCOUNT_AUTHORITY: 'https://fitness-account-i47taxhzba-as.a.run.app'
  _FITNESS_ACCOUNT_ISSUER: 'https://fitness-account-i47taxhzba-as.a.run.app'
  _NUTRITION_REDIRECT_URI: 'https://nutrition-diary-app.vercel.app/api/auth/central/callback'
  _WORKOUT_SUMMARY_URL: 'https://workout-api-i47taxhzba-as.a.run.app/api/integrations/v1/training-summary'
  # Physique photos share the FinancialApp vault bucket under the nutrition-physique/ prefix;
  # scans use their own short-retention bucket. Both were dropped when this pipeline replaced the
  # nourish-api one, which left photo upload and AI scanning returning 503 on the live service.
  _PHYSIQUE_BUCKET: 'financialapp-vault-396431756440'
  _SCAN_BUCKET: 'nourish-scans-396431756440'

options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
