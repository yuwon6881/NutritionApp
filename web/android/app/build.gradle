apply plugin: 'com.android.application'

def signingStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def debugSigningStoreFile = System.getenv('ANDROID_DEBUG_KEYSTORE_PATH')
def debugSigningKeyAlias = System.getenv('ANDROID_DEBUG_KEY_ALIAS')
def debugSigningStorePassword = System.getenv('ANDROID_DEBUG_KEYSTORE_PASSWORD')
def debugSigningKeyPassword = System.getenv('ANDROID_DEBUG_KEY_PASSWORD')
def hasStableDebugSigningKey = debugSigningStoreFile && debugSigningKeyAlias && debugSigningStorePassword && debugSigningKeyPassword

android {
    namespace = "com.nutritionapp.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nutritionapp.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        deviceTestDebug {
            if (hasStableDebugSigningKey) {
                storeFile file(debugSigningStoreFile)
                storeType 'PKCS12'
                storePassword debugSigningStorePassword
                keyAlias debugSigningKeyAlias
                keyPassword debugSigningKeyPassword
            }
        }
        release {
            if (signingStoreFile && signingKeyAlias && signingStorePassword && signingKeyPassword) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasStableDebugSigningKey) {
                signingConfig signingConfigs.deviceTestDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingStoreFile && signingKeyAlias && signingStorePassword && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (!servicesJSON.exists()) {
    throw new GradleException("Firebase Android configuration is required for push notifications: ${servicesJSON}")
}
apply plugin: 'com.google.gms.google-services'
